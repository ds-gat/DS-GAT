# Ablation A1 — neighbourhood-based stream only, of DSGAT3 on cn15k (same hyperparameters, seed 42)
#   python models.py --config config/ablation/DSGAT3A1_cn15k.yaml

# ── Model ─────────────────────────────────────────────────────────────────────
modelname: DSGAT3A1
score: complex                  # choices: dismult | complex | rotate | transe | hybrid
embedding_dim: 400
numhops: 2
dropout: 0.2
edge_weight_mode: bayesian      # choices: normalize | concat | none | learnable | bayesian
nll_lambda: 0.2                 # tau_KL, weight of the KL calibration term

beta_lambda: 0.1                # tau_conf, weight of the Beta confidence NLL
evidence_lr: 0.05               # eta_e, learning rate of the relational-evidence strengths

# ── Dataset ───────────────────────────────────────────────────────────────────
dataset: cn15k
weighted: true
no_directed: false

# ── Training ──────────────────────────────────────────────────────────────────
n_epochs: 3000
evaluate_every: 300
graph_batch_size: -1            # -1 = use all training triplets per step
negative_sample: 50
test_graph_size: -1             # -1 = use all train triplets for val/test graph
regularization: 0.01
grad_norm: 1.0
seed: 42

# ── Optimizer (Adam + ReduceLROnPlateau) ──────────────────────────────────────
lr: 0.001
lr_decay_factor: 0.5
lr_patience: 100
min_lr: 1.0e-5

# ── Early stopping ────────────────────────────────────────────────────────────
early_stop_patience: 20         # eval intervals with no MRR improvement
early_stop_delta: 0.001

# ── Hardware ──────────────────────────────────────────────────────────────────
gpu: 0                          # -1 for CPU
